name: Time Converter CI/CD

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Author information
        run: |
          echo "Author / Developer: jobikii"
          echo "Repository: ${{ github.repository }}"
          echo "Commit SHA: ${{ github.sha }}"
          echo "Push triggered by: ${{ github.actor }}"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build DLL and TimeConverter.exe
        shell: pwsh
        run: |
          g++ -shared -O2 calculation.cpp -o calculation.dll
          if (-not (Test-Path "calculation.dll")) {
            Write-Error "Failed to build calculation.dll"
            exit 1
          }
          pyinstaller --noconfirm --onefile --windowed --name "TimeConverter" --add-data "calculation.dll;." gui.py
          if (-not (Test-Path "dist/TimeConverter.exe")) {
            Write-Error "Failed to build TimeConverter.exe"
            exit 1
          }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Time Converter Build #${{ github.run_number }}"
          body: |
            Automated CI/CD build for **Time Converter** by `jobikii`.
            Commit: `${{ github.sha }}`
          files: dist/TimeConverter.exe
